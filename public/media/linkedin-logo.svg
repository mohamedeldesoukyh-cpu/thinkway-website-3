<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Background -->
  <rect width="300" height="300" fill="#0a0f1e"/>

  <!-- Blue accent glow -->
  <radialGradient id="glow" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#1535C2" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#0a0f1e" stop-opacity="0"/>
  </radialGradient>
  <rect width="300" height="300" fill="url(#glow)"/>

  <!-- THINKWAY wordmark -->
  <text
    x="150" y="155"
    font-family="'Helvetica Neue','Arial Black',Arial,sans-serif"
    font-weight="900"
    font-size="38"
    letter-spacing="-1.5"
    text-anchor="middle"
    fill="#ffffff"
  >THINKWAY</text>

  <!-- Blue dot + rule centered under text -->
  <circle cx="42" cy="172" r="4" fill="#1535C2"/>
  <line x1="50" y1="172" x2="258" y2="172" stroke="rgba(255,255,255,0.18)" stroke-width="0.8"/>

  <!-- Tagline -->
  <text
    x="150" y="195"
    font-family="'Helvetica Neue',Arial,sans-serif"
    font-weight="400"
    font-size="9"
    letter-spacing="3"
    text-anchor="middle"
    fill="rgba(255,255,255,0.35)"
  >MEDIA AGENCY</text>
</svg>
