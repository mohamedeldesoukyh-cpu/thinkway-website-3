<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 191" width="1128" height="191">
  <!-- Background -->
  <rect width="1128" height="191" fill="#0a0f1e"/>

  <!-- Blue depth glow left -->
  <radialGradient id="glowLeft" cx="20%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#1535C2" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#0a0f1e" stop-opacity="0"/>
  </radialGradient>
  <rect width="1128" height="191" fill="url(#glowLeft)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="63" x2="1128" y2="63" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="127" x2="1128" y2="127" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="376" y1="0" x2="376" y2="191" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="752" y1="0" x2="752" y2="191" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Blue vertical accent bar -->
  <rect x="64" y="52" width="3" height="87" fill="#1535C2" opacity="0.9"/>

  <!-- THINKWAY wordmark -->
  <text
    x="82" y="107"
    font-family="'Helvetica Neue','Arial Black',Arial,sans-serif"
    font-weight="900"
    font-size="52"
    letter-spacing="-2"
    fill="#ffffff"
  >THINKWAY</text>

  <!-- Blue dot + rule under wordmark -->
  <circle cx="82" cy="122" r="4" fill="#1535C2"/>
  <line x1="91" y1="122" x2="420" y2="122" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>

  <!-- Divider -->
  <line x1="500" y1="52" x2="500" y2="139" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Tagline -->
  <text
    x="530" y="90"
    font-family="'Helvetica Neue',Arial,sans-serif"
    font-weight="400"
    font-size="13"
    letter-spacing="3.5"
    fill="rgba(255,255,255,0.35)"
  >WHERE INFLUENCE MEETS STRATEGY</text>

  <text
    x="530" y="115"
    font-family="'Helvetica Neue',Arial,sans-serif"
    font-weight="300"
    font-size="11"
    letter-spacing="2"
    fill="rgba(255,255,255,0.2)"
  >MENA &amp; GLOBAL — INFLUENCER · CONTENT · SOOH</text>

  <!-- Website -->
  <text
    x="530" y="136"
    font-family="'Helvetica Neue',Arial,sans-serif"
    font-weight="400"
    font-size="10"
    letter-spacing="1.5"
    fill="#1535C2"
    opacity="0.8"
  >hello@thinkwaymedia.com</text>

  <!-- Corner accent dots -->
  <circle cx="1092" cy="24" r="3" fill="#1535C2" opacity="0.4"/>
  <circle cx="1106" cy="24" r="3" fill="#1535C2" opacity="0.25"/>
  <circle cx="1120" cy="24" r="3" fill="#1535C2" opacity="0.12"/>
</svg>
